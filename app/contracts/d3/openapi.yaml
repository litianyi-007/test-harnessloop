components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        认证 JWT（access token，回答"我是谁"）。与 License JWT（回答"我有权用什么"）是两个不同的凭证，
