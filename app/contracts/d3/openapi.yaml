  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            机器可读错误码。已知协议层错误码举例（不臆造未列出的）：
            `billing_query_subject_unresolved`（D1 §9.1/D2 §3.8）、
            `aggregate_billing_requires_deployment_token`（D1 §2.1，注：这是内核 createSession 的拒绝码，
            不是本 D3 API 直接返回的错误，此处仅作说明性列举，帮助调用方理解上下游关系）。
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    AuthTokenPair:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
          description: x-todo：具体有效期数值未定。
        refreshTokenExpiresAt:
          type: string
          format: date-time
          description: x-todo：具体有效期数值未定。

    MeResponse:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        authMethod:
          type: string
          enum: [browser_oauth, license_key]
          description: |
            x-todo：`license_key` 分支能否单独构成身份仍是开放项（见 /auth/license-key/redeem 描述），
            此枚举值先占位，不代表已裁决"License key 可独立登录"。

    License:
      type: object
      required: [plan, status]
      description: |
        对应 server-stack-selection.md `license`（plan、entitlements、exp、status）实体，
        应用内签发 Ed25519 JWT，配 `licenses` + `revocations` 两张表。
      properties:
        plan:
          type: string
          description: |
            x-todo：具体枚举值未在 D3 confirmed 文档定死（P0 阶段只提到"个人 free / 企业 paid plan"），
            此字段先用自由字符串占位，不预设完整枚举（如是否细分多档 paid plan）。
          example: free
        entitlements:
          type: object
          additionalProperties: true
          description: JSONB `entitlements`——具体字段集未在 D3 定义，按需扩展，不预设结构。
        exp:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - no_license
            - pending_activation
            - active
            - expiring_soon
            - grace_period
            - expired
            - revoked
          description: |
            **诚实标注（不得省略）**：`grace_period` 是 d5-6-account-license.md §4.2 的**本页产品提案**，
            **不是 D3 confirmed 存在此机制**（该页 v2.1 收尾专门订正此前"D3 confirmed 存在 grace period"
            的误称）。D3 只 confirm"需要定义 max offline period 与强制在线刷新策略"，**未 confirm**
            是否存在该中间态、到期后是否仍可用、转移条件或传播机制。若产品/安全决策最终裁定"到期即刻阻断，
            不设宽限"，该值不会出现，本 enum 仍先保留以覆盖两种可能性，具体是否启用**待产品+安全决策**。
        tenantId:
          type: string
          nullable: true
          description: 企业坐席绑定的 tenant；个人 free license 为 null。

    Tenant:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [personal, enterprise]
        id:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
          description: x-todo：用户可见文案（工作区/组织/团队）未冻结，见路径描述。

    Seat:
      type: object
      required: [status, role]
      description: |
        对应 server-stack-selection.md `seat`/`membership`（role、状态），P0 用 `memberships` + `seat_limit`。
      properties:
        tenantId:
          type: string
        role:
          type: string
          description: |
            x-todo：具体角色枚举未在 D3/D5.6 定义（该页 §6.1 只提到"membership.role"字段本身，
            未列出角色枚举值），此字段先用自由字符串占位。
          example: member
        status:
          type: string
          enum: [invited, active, suspended, removed]
          description: |
            对应 d5-6-account-license.md §6.3 坐席/membership 只读状态机。
            `suspended`/`removed` 状态变更的实时传播机制（推送 vs 下次登录校验 vs 定期轮询）
            **未能确认**，D3 confirmed 文档未定义此传播机制，D1 `KernelEvent` 判别联合里也确无此类事件。

    FeatureFlags:
      type: object
      properties:
        flags:
          type: object
          additionalProperties: true
          description: |
            对应 server-stack-selection.md `tenant_features`/`feature_flags` JSONB `entitlements`。
            具体 flag 命名/取值集未在 D3 定义，本 schema 不预设结构，只保证"这是一个租户级准入配置对象"。

    BillingQuota:
      type: object
      description: |
        L1 席位/plan 额度（d5-4-cost-usage.md §2.2）。个人免费 tier 与企业按坐席两种呈现共用同一形状，
        企业分支下 `seat` 字段有值，个人分支下为 null。
      properties:
        license:
          $ref: "#/components/schemas/License"
        seat:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Seat"

    SessionBillingSnapshot:
      type: object
      required:
        - sessionId
        - attribution
        - fetchedAt
        - correlatable
      description: |
        逐字段对应 [[d1-kernelport-spec-v3-5]] §7（confirmed），见 d5-4-cost-usage.md §2.3 展开表。
      properties:
        sessionId:
          type: string
          description: 内部关联键，D5.4 不直接展示。
        tokenRef:
          type: string
          description: 内部计费凭证引用（D1 §7 注入链契约步骤②），不直接展示。
        attribution:
          type: string
          enum: [session, user_tenant_aggregate]
          description: |
            部署时静态声明，非运行时推断（D1 §4.1）。决定整个用量卡片走哪条呈现分支。
            **PRE-① C-3 已裁定（2026-07-22）**：session 级归因（path①）对两内核成立——hermes 部署
            返回 `session`；openclaw 部署在 per-session 凭证 patch 落地前返回 `user_tenant_aggregate`。
        windowStart:
          type: string
          format: date-time
          description: |
            x-todo（[[d6-newapi-integration]] §5.1 v2.1 更正）：newapi 侧**没有**一个原生对应的
            "查询窗口起止"字段——本字段若要落地，需由 D3/adapter 在发起查询时自行记录，
            不是 newapi 直接提供的原生数据。
        windowEnd:
          type: string
          format: date-time
          description: 同 windowStart 的 x-todo 标注。
        requestCount:
          type: number
          description: |
            x-todo（同上 D6 §5.1 v2.1 更正）：没有 newapi 原生字段对应，是应用层对 `GET /api/log/self`
            按 `token_name` 过滤后返回的日志条目计数的近似值，非 newapi 原生返回的字段名。
        totalQuota:
          type: number
        rpm:
          type: number
          nullable: true
          description: MVP 可不做展示（超出最小化范围，见 d5-4-cost-usage.md §3"MVP 明确不做"）。
        tpm:
          type: number
          nullable: true
        fetchedAt:
          type: string
          format: date-time
          description: |
            **强约束**：必须展示"数据截至 X 分钟前"——D1 明确"非 run 级、非实时"，不得暗示实时。
        correlatable:
          type: boolean
          enum: [false]
          description: |
            恒定值 `false`——**不得**展示为可勾选/可关联项，UI 不得暗示"可以做请求级精确关联"。

    NewApiEndpointConfig:
      type: object
      required: [baseUrl]
      properties:
        baseUrl:
          type: string
          format: uri
          description: |
            newapi 网关实例地址，租户/环境级配置，全体 session 共享，非 per-session 输入
            （[[d1-kernelport-spec-v3-5]] §2.1）。
        deploymentTokenRef:
          type: string
          nullable: true
          description: |
            path②（aggregate）下必填；path①下可省略。缺失且处于 aggregate 模式时，内核
            `createSession` 会同步拒绝 `aggregate_billing_requires_deployment_token`（D1 §2.1 步骤 0）。

    BillingTokenMintResponse:
      type: object
      required: [tokenRef, key]
      properties:
        tokenRef:
          type: string
          description: 写入 SessionHandle.billing.tokenRef 的引用（D1 §7）。
        key:
          type: string
          description: |
            该 session 专属的明文 key（newapi `GetTokenKey` 结果），供 client-local adapter
            注入内核 LLM 出口配置（步骤④，发生在 client 本地）。
        expiresAt:
          type: string
          format: date-time
          nullable: true

    NewApiTokenAdmin:
      type: object
      required: [id, tenantId]
      description: 对应 newapi Token CRUD（`POST/GET/DELETE /api/token/:id`），D3 代理，非 session 级。
      properties:
        id:
          type: string
          description: |
            x-todo：newapi 创建响应本身不含 id，此字段实际取法待实现前冒烟确认，
            见 [[d6-newapi-integration]] §3.1/§7 #11。
        tenantId:
          type: string
        name:
          type: string
          description: newapi 侧 `name` 字段，源码限长 50（D6 §3.1 confirmed，文档写 30，以源码为准）。
        quota:
          type: number
        status:
          type: string

    NewApiUsageLogEntry:
      type: object
      description: |
        粒度是"一次模型调用"（D6 §5.3 confirmed），**没有** Chat/Turn/runId 关联键——
        newapi `request_id`/`upstream_request_id` 不是可回查的一等产品语义（T-009 N3 confirmed）。
      properties:
        tokenName:
          type: string
        modelName:
          type: string
        quota:
          type: number
        promptTokens:
          type: number
        completionTokens:
          type: number
        useTime:
          type: string
          format: date-time
        channelId:
          type: string
        group:
          type: string

    NewApiModelChannel:
      type: object
      description: |
        x-todo：精确字段面未在源文档逐条确认（[[d6-newapi-integration]] §4.1"仅能力面 confirmed，
        精确 REST 路径未能确认"），本 schema 只占位最常识性的字段，实现前需按目标 newapi 版本核实。
      properties:
        channelId:
          type: string
        modelName:
          type: string
        pricing:
          type: object
          additionalProperties: true

    ModelCatalogEntry:
      type: object
      required: [tier, modelId]
      description: |
        composer 档位隐喻（如 Sol/Terra/Luna，参见 [[d5-7-model-kernel]] §3.1/§3.2）→ 具体 newapi
        模型标识的映射行，路由表归属 D3/Console（[[d6-newapi-integration]] §6.3）。
      properties:
        tier:
          type: string
          description: x-todo：档位命名本身未最终冻结（见 d5-7-model-kernel.md），此处不预设具体档位名集合。
        modelId:
          type: string
          description: 传给 `CreateSessionConfig.model` 的不透明字符串（D5.7 §3.3 应用层编码约定）。
        provider:
          type: string
          nullable: true
        effort:
          type: string
          nullable: true
